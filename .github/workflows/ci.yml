name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Routing tests (67 cases)
        run: bun run test:routing

      - name: Jury tests (74 checks)
        run: bun run test:jury

      - name: Model-pin tests (52 checks)
        run: bun run test:pin

      - name: Relevance gate tests
        run: bun run test:relevance

      - name: Court render tests (48 checks, 12 variants)
        run: bun run test:render

      - name: Compute tool tests (P1-3)
        run: bun run test:compute

  standalone:
    # P0-5: the deployment-bug-class killer — build the TRACED standalone
    # artifact and exercise every export format + the new v3.3 surfaces
    # against it. The v3.2.1 PDF bug shipped because nothing tested the
    # artifact, only the source tree.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digdeep
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/digdeep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema push
        run: npx prisma db push --skip-generate

      - name: Migration state test (prod-like / clean / zero / P3009 wedge)
        run: bash scripts/test-migration.sh

      - name: Standalone artifact integration test (all 4 exports + surfaces)
        run: bash scripts/test-standalone.sh
